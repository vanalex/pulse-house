name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke test
        run: make ci

      - name: Show service logs
        if: failure()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down -v
